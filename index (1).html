<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premiere AI</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="logo-container">
                <div class="logo">P</div>

                <div class="brand">
                    <h1>Premiere <span>AI</span></h1>
                    <p>Adobe Premiere Pro Assistant</p>
                </div>
            </div>

            <button class="new-chat-button" id="newChat">
                <span>＋</span>
                Nieuwe chat
            </button>

        </header>


        <!-- CHAT -->
        <main class="chat-container">

            <section class="welcome-screen" id="welcomeScreen">

                <div class="welcome-icon">
                    ✦
                </div>

                <h2>Waar kan ik je mee helpen?</h2>

                <p>
                    Stel een vraag over Adobe Premiere Pro.
                    Ik help je stap voor stap.
                </p>

                <div class="suggestions">

                    <button class="suggestion"
                        data-question="Hoe maak ik een smooth zoom?">

                        <span class="suggestion-icon">↗</span>

                        <div>
                            <strong>Smooth zoom</strong>
                            <small>Maak vloeiende zoombewegingen</small>
                        </div>

                    </button>


                    <button class="suggestion"
                        data-question="Hoe maak ik mijn video zwart-wit?">

                        <span class="suggestion-icon">◐</span>

                        <div>
                            <strong>Kleurcorrectie</strong>
                            <small>Pas de kleuren van je video aan</small>
                        </div>

                    </button>


                    <button class="suggestion"
                        data-question="Hoe zorg ik ervoor dat mijn audio harder klinkt?">

                        <span class="suggestion-icon">♫</span>

                        <div>
                            <strong>Audio verbeteren</strong>
                            <small>Verbeter het geluid van je video</small>
                        </div>

                    </button>


                    <button class="suggestion"
                        data-question="Hoe exporteer ik mijn video in de beste kwaliteit?">

                        <span class="suggestion-icon">⇧</span>

                        <div>
                            <strong>Video exporteren</strong>
                            <small>De juiste exportinstellingen</small>
                        </div>

                    </button>

                </div>

            </section>


            <!-- MESSAGES -->
            <section class="messages" id="messages"></section>

        </main>


        <!-- INPUT -->
        <footer class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    placeholder="Stel een vraag over Premiere Pro..."
                    rows="1"
                ></textarea>

                <button id="sendButton" class="send-button" aria-label="Verstuur">
                    ↑
                </button>

            </div>

            <p class="disclaimer">
                Premiere AI kan fouten maken. Controleer belangrijke informatie.
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
