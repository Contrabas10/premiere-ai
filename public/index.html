<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premiere AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="brand">
            <div class="logo">P</div>

            <div>
                <h1>Premiere AI</h1>
                <p>Adobe Premiere Pro Assistant</p>
            </div>
        </div>

        <button id="newChatBtn" class="new-chat">
            + Nieuwe chat
        </button>
    </header>

    <main class="main">

        <section id="welcome" class="welcome">

            <div class="welcome-icon">🎬</div>

            <h2>Waar kan ik je mee helpen?</h2>

            <p>
                Stel een vraag over Adobe Premiere Pro,
                effecten, montage, audio of export.
            </p>

            <div class="suggestions">

                <button class="suggestion"
                    data-question="Hoe maak ik een smooth zoom effect?">
                    🔍 Smooth zoom
                </button>

                <button class="suggestion"
                    data-question="Hoe maak ik mijn video zwart-wit?">
                    🎨 Zwart-wit
                </button>

                <button class="suggestion"
                    data-question="Hoe verbeter ik het geluid van mijn video?">
                    🎧 Audio verbeteren
                </button>

                <button class="suggestion"
                    data-question="Wat zijn de beste exportinstellingen voor YouTube?">
                    📤 Exportinstellingen
                </button>

            </div>

        </section>

        <section id="messages" class="messages"></section>

    </main>

    <footer class="chat-footer">

        <div class="input-container">

            <textarea
                id="userInput"
                placeholder="Stel je vraag over Premiere Pro..."
                rows="1"
            ></textarea>

            <button id="sendBtn" class="send-button">
                ↑
            </button>

        </div>

        <p class="disclaimer">
            Premiere AI kan fouten maken. Controleer belangrijke instellingen altijd.
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
